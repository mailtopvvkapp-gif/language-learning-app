name: Build Cross-Platform App (Android & iPhone)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Self-Healing Platform Files & Fallback Icon
        run: |
          # 1. assets/icon ఫోల్డర్ లేకపోతే డమ్మీ లోగోను తయారుచేస్తుంది
          mkdir -p assets/icon
          if [ ! -f "assets/icon/app_logo.png" ]; then
            # 1x1 transparent PNG fallback byte
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 --decode > assets/icon/app_logo.png
          fi

          # 2. android ప్లాట్‌ఫారమ్ ఫైల్స్ లేకపోతే ఆటోమేటిక్‌గా క్రియేట్ చేస్తుంది
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Get Dependencies
        run: |
          flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iPhone iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Self-Healing Platform Files & Fallback Icon
        run: |
          mkdir -p assets/icon
          if [ ! -f "assets/icon/app_logo.png" ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 --decode > assets/icon/app_logo.png
          fi

          if [ ! -d "ios" ]; then
            flutter create --platforms=ios .
          fi

      - name: Get Dependencies
        run: |
          flutter pub get

      - name: Build iOS Runner
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload as ZIP
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r iPhone-App-Payload.zip Payload

      - name: Upload iPhone iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-iOS-Build
          path: build/ios/iphoneos/iPhone-App-Payload.zip
          if-no-files-found: error
          retention-days: 14
          
