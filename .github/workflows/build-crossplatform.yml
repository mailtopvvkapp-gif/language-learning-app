name: Build Cross-Platform App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Fast Generate Meaningful App Logo & Assets
        run: |
          mkdir -p assets/icon assets/data
          
          # Generate meaningful HD Akshara app logo via pure Python in < 2 seconds
          python3 -c "
          from PIL import Image, ImageDraw, ImageFont
          import os

          size = (1024, 1024)
          img = Image.new('RGBA', size, (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)

          # Deep purple rounded background
          draw.rounded_rectangle([(0, 0), (1024, 1024)], radius=220, fill=(43, 22, 84))

          # Golden glow ring
          draw.ellipse([(72, 72), (952, 952)], outline=(255, 215, 0, 180), width=18)

          # Open book / learning slate base
          draw.polygon([(200, 720), (512, 650), (824, 720), (824, 780), (512, 710), (200, 780)], fill=(108, 92, 231))

          # Decorative star sparkles
          draw.ellipse([(260, 240), (290, 270)], fill=(255, 234, 167))
          draw.ellipse([(760, 270), (786, 296)], fill=(255, 234, 167))

          img.save('assets/icon/app_logo.png', 'PNG')
          print('Logo generated successfully.')
          "

          # Fallback if PIL is not installed
          if [ ! -f "assets/icon/app_logo.png" ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 --decode > assets/icon/app_logo.png
          fi

      - name: Clean Recreate Android v2 Scaffolding
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example .

      - name: Configure App Name and SDK Levels
        run: |
          # Set App Label to Akshara
          sed -i 's/android:label="[^"]*"/android:label="Akshara"/g' android/app/src/main/AndroidManifest.xml || true
          
          # Set minSdkVersion to 21 for flutter_tts compatibility
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true
          fi

      - name: Accept Licenses & Get Dependencies
        run: |
          yes | flutter doctor --android-licenses || true
          flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
