name: Build Cross-Platform App (Android & iPhone)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Self-Healing Assets & Directories
        run: |
          mkdir -p assets/icon assets/data
          if [ ! -f "assets/icon/app_logo.png" ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 --decode > assets/icon/app_logo.png
          fi
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Analyze Dart Code (Show Exact Errors)
        run: |
          flutter analyze || true

      - name: Build Android Release APK (Verbose)
        run: |
          flutter build apk --release --no-tree-shake-icons --verbose

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
