name: Build Cross-Platform App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Ensure Assets and Files Exist
        run: |
          mkdir -p assets/icon assets/data
          # డమ్మీ ఐకాన్
          if [ ! -f "assets/icon/app_logo.png" ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 --decode > assets/icon/app_logo.png
          fi
          # డమ్మీ డేటా ఫైల్స్ (ఖాళీ ఫోల్డర్ వల్ల క్రాష్ కాకుండా)
          if [ ! -f "assets/data/telugu_content.json" ]; then
            echo '{"step2_words":[], "step4_gunintalu_words":[]}' > assets/data/telugu_content.json
          fi
          if [ ! -f "assets/data/hindi_content.json" ]; then
            echo '{"step2_words":[], "step4_gunintalu_words":[]}' > assets/data/hindi_content.json
          fi
          if [ ! -f "assets/data/english_content.json" ]; then
            echo '{"step2_words":[], "step4_gunintalu_words":[]}' > assets/data/english_content.json
          fi

      - name: Clean & Prepare Android Native Files
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.example .
          fi
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Set Android Min SDK 21
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true
          fi

      - name: Accept Licenses & Get Dependencies
        run: |
          yes | flutter doctor --android-licenses || true
          flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
